[package]
name = "meera-notchd"
version = "0.1.0"
edition = "2021"
authors = ["M Rizqi Nurrahman <152271198+rizqinrr@users.noreply.github.com>"]
license = "CC-BY-NC-SA-4.0"
description = "High-performance backend daemon for meera-notch"

[[bin]]
name = "meera-notchd"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "signal", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
